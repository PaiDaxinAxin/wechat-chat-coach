name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser -- --https-proxy
      - run: npm run test:demo
      - run: npm run test:style
      - run: npm run test:a11y
      - run: npm run test:topics
      - run: node scripts/verify-reply-guidance.mjs
      - run: node tests/verify-image-input.mjs
      - run: git diff --check

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: postgres-store
            database: coach_store
          - suite: postgres-knowledge
            database: coach_knowledge
          - suite: postgres-store-api
            database: coach_api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coach_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ${{ matrix.database }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHAT_COACH_TEST_DATABASE_URL: postgresql://coach_test:synthetic-ci-only@127.0.0.1:5432/${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/${{ matrix.suite }}.test.mjs tests/cloud.test.mjs
